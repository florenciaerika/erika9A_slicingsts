<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Berry Bakeshop - Cookies terbaik dengan resep yang telah teruji berkali-kali" />
    <title>Berry Bakeshop - The Best Chocolate Chip Cookies</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="desktop" role="main">
      <header class="bakeshop-header">
        <h1 class="text-wrapper">Berry Bakeshop</h1>
      </header>
      <section class="content-section" aria-labelledby="bakeshop-story">
        <figure class="cookie-image-container">
          <img
            class="ellipse"
            src="Ellipse 1.png"
            alt="Delicious chocolate chip cookies arranged in a circular pattern"
          />
        </figure>
        <article class="story-content">
          <p class="resep-ini-bukan" id="bakeshop-story">
            Resep ini bukan diciptakan sekali jadi.<br />
            Butuh banyak percobaan, gagal berkali-kali, <br />sampai akhirnya lahir cookies yang <br />bikin teman-teman
            kami bilang: <br />'ini nggak boleh berhenti dijual
          </p>
        </article>
        <img class="the-best-chocolate" src="img/the-best-chocolate-chip-cookies-1.png" alt="" role="presentation" />
      </section>
    </main>
  </body>
</html>
